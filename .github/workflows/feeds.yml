name: Update Kamloops feeds

# Fetches the community + local-news RSS/Atom feeds and commits feeds.json,
# which the dashboard reads same-origin (no CORS, no live backend). GitHub's
# runner IPs are rarely blocked by these sources.

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 min (GitHub may delay under load)
  workflow_dispatch:            # adds a manual "Run workflow" button

concurrency:
  group: kamloops-feeds
  cancel-in-progress: false

permissions:
  contents: write               # needed to commit feeds.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build feeds.json
        run: node scripts/build-feeds.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- feeds.json; then
            echo "No change — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add feeds.json
            git commit -m "Update Kamloops feeds"
            git push
          fi
